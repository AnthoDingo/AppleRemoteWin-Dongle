name: Release

# Push a tag (v1.2.0), or run it by hand on that tag (Actions > Release > Run workflow > Use workflow from: Tags > v1.2.0).
# Builds the release and debug firmware, signs both with the project key and publishes them (see package.py for the
# files). The Windows app downloads AppleRemoteEsp32.bin from the latest release at build time.
#
# The key comes from the OTA_SIGNING_KEY secret of the "release" environment (PEM content, README "Releases"): that
# environment requires a reviewer and only accepts v* tags, so the key is only exposed to an approved release run.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.ref_name }}
      # Public fingerprint of the project key (README, "Signing key"): SHA-256 of the DER public key, the same on every
      # OS (a PEM's hash depends on its line endings). Refuses to sign with any other key.
      KEY_FINGERPRINT: aaf07e29f7effd155b59586e6b3f5771283747e3d692092c12bd617a6c73b294
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'dependencies.lock') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Check the version
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run the release on a tag (Use workflow from: Tags > v…), not on a branch"
            exit 1
          fi
          version=$(sed -n 's/^CONFIG_APP_PROJECT_VER="\(.*\)"/\1/p' sdkconfig.defaults)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::sdkconfig.defaults says $version, the tag is $TAG"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install the signing key
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$OTA_SIGNING_KEY" | tr -d '\r' > ota_signing_key.pem
          if [ ! -s ota_signing_key.pem ] || ! openssl rsa -in ota_signing_key.pem -noout 2>/dev/null; then
            # Typical cause: secret pasted at gh's prompt, which keeps only the first line (README, "Releases")
            echo "::error::OTA_SIGNING_KEY is missing or is not a readable PEM private key ($(wc -l < ota_signing_key.pem) lines)"
            exit 1
          fi
          fingerprint=$(openssl rsa -in ota_signing_key.pem -pubout -outform DER 2>/dev/null | openssl dgst -sha256 | awk '{print $NF}')
          if [ "$fingerprint" != "$KEY_FINGERPRINT" ]; then
            # The public fingerprint reveals nothing about the private key
            echo "::error::OTA_SIGNING_KEY is a private key, but not the project's one (public fingerprint $fingerprint)"
            exit 1
          fi
      - name: Build and sign (release + debug)
        # Retried once: PlatformIO's first ESP-IDF build of an environment sometimes races in ldgen.
        run: pio run -e xiao_esp32s3 -e xiao_esp32s3_debug || pio run -e xiao_esp32s3 -e xiao_esp32s3_debug
      - name: Verify the signatures with the project key
        run: |
          for env in xiao_esp32s3 xiao_esp32s3_debug; do
            python ~/.platformio/packages/tool-esptoolpy/espsecure.py verify_signature --version 2 \
              --keyfile ota_signing_key.pem ".pio/build/$env/firmware.bin"
          done
      - name: Remove the signing key
        if: always()
        run: rm -f ota_signing_key.pem
      - name: Package
        run: python package.py "$VERSION"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --target "$GITHUB_SHA"
