; PlatformIO build of the same ESP-IDF project as idf.py: same CMakeLists.txt, idf_component.yml, sdkconfig.defaults
; and partitions.csv. VS Code: open this repository with the PlatformIO extension.

[platformio]
src_dir = main

[env:xiao_esp32s3]
platform = espressif32 @ ^6.9.0
board = seeed_xiao_esp32s3
framework = espidf
board_build.partitions = partitions.csv
; Same layout as sdkconfig.defaults (4 MB used, even on 8 MB boards); size check against one OTA slot
board_upload.flash_size = 4MB
board_upload.maximum_size = 1048576
; Signs the app with ota_signing_key.pem if the build did not (refuses to produce an unsigned updatable firmware)
extra_scripts = post:sign.py
monitor_speed = 115200

; Same firmware + a USB serial port carrying the logs (PID 0x8A53): Upload, then Monitor. Never shipped by the app
; (it bundles .pio/build/xiao_esp32s3/firmware.bin only).
[env:xiao_esp32s3_debug]
extends = env:xiao_esp32s3
build_flags = -DAPPLEREMOTE_USB_LOG
monitor_filters = direct
